name: Initialize website source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    if: github.repository == 'snumath1946/research-notices'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify and unpack reviewed source
        env:
          SOURCE_SHA256: 0482658cf44eceb489979a8d6ae9a1f8f9d4e133c710b81cdf24b09f906a536b
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, zipfile
          archive = pathlib.Path('research-notices-source.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == os.environ['SOURCE_SHA256'], 'Source archive does not match reviewed version'
          root = pathlib.Path.cwd().resolve()
          with zipfile.ZipFile(archive) as source:
              assert source.testzip() is None, 'Archive integrity failed'
              for entry in source.infolist():
                  relative = pathlib.PurePosixPath(entry.filename)
                  if relative.parts[0] in {'.git', '.github'}:
                      continue
                  assert not relative.is_absolute() and '..' not in relative.parts
                  assert relative.name not in {'.env', 'credentials'} and relative.suffix.lower() not in {'.key', '.pem'}
                  destination = root.joinpath(*relative.parts).resolve()
                  assert destination.is_relative_to(root)
                  if entry.is_dir():
                      destination.mkdir(parents=True, exist_ok=True)
                  else:
                      if destination.exists():
                          assert destination.read_bytes() == source.read(entry), 'Existing content differs; refusing overwrite'
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(source.read(entry))
          PY
      - name: Verify website
        run: |
          node tests/model.test.cjs
          node tests/admin.test.cjs
          node tests/export.test.cjs
          node scripts/verify.cjs
      - name: Save website source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .gitignore README.md THIRD_PARTY_NOTICES.md package.json dist docs scripts tests '*.cmd'
          if ! git diff --cached --quiet; then
            git commit -m 'Initialize verified research notice website'
            git push origin HEAD:main
          fi
